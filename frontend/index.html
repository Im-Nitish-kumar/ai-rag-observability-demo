<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI RAG Observability Demo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header>
      <div>
        <h1>AI RAG Observability Demo</h1>
        <p id="backend-label">Connecting to backend...</p>
      </div>
    </header>

    <main>
      <div id="chat-window" class="chat-window"></div>
      <form id="chat-form" class="chat-form">
        <input id="question-input" type="text" placeholder="Ask a question about OpenObserve..." autocomplete="off" />
        <button type="submit">Send</button>
      </form>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
